services:
  db:
    image: postgres:17-alpine
    container_name: stok-depo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stok
      POSTGRES_PASSWORD: stok_sifre
      POSTGRES_DB: stok_depo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stok -d stok_depo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  